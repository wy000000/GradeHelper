[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradehelper"
dynamic = ["version"]
description = "课程报告自动化评分系统（MinerU 解析 + 规则引擎 + LLM 评估）"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "requests>=2.31",
    "mineru>=4.0,<5",
]

[project.scripts]
gradehelper = "gradehelper.__main__:main"

[tool.setuptools.packages.find]
include = ["gradehelper*"]

[tool.setuptools.dynamic]
version = { attr = "gradehelper.__version__" }
