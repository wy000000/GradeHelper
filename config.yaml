# 评分系统配置文件（端点、路径、Prompt 均在此外置配置）

endpoints:
  # 通用 LLM 评分端点（OpenAI 兼容接口；不限定本地或 llama 实现）
  llm:
    client:                # 客户端专用参数（不会发送给 API）
      base_url: "http://localhost:8080/"
      api_key: ""          # OpenAI 兼容鉴权密钥；本地无鉴权时留空
      connect_timeout: 10  # TCP/TLS 连接超时（秒）
      read_timeout: 300    # 等待响应数据的超时（秒）
      max_retries: 3       # LLM 端点的失败重试次数配置。
    api:                   # 发送给 /chat/completions 的参数；新增任意键都会自动透传
      model: "qwen35-thinking-general"
      temperature: 0.0     # 贪心解码
      top_p: 1.0           # 关闭
      top_k: 0             # 关闭（部分引擎用 0/负数表示禁用）
      min_p: 0.0           # 关闭；若引擎要求非零可用 0.05
      presence_penalty: 0.0  # 必须为 0
      frequency_penalty: 0.0 # 同理为 0
      repeat_penalty: 1.0  # 保持关闭；只有输出复读时才微调到 1.03~1.05
      seed: 42             # 固定种子
      reasoning: "on"      # 保留；让模型先分析证据再打分
      #max_tokens: 4096
  # 图片批量识别端点（多模态，含 mmproj）；默认与 llm 相同，可各自独立覆盖
  vllm:
    client:                # 客户端专用参数（不会发送给 API）
      base_url: "http://localhost:8080/"
      api_key: ""          # OpenAI 兼容鉴权密钥；本地无鉴权时留空
      connect_timeout: 10  # TCP/TLS 连接超时（秒）
      read_timeout: 300    # 等待响应数据的超时（秒）
      max_retries: 3       # VLLM 端点的失败重试次数配置。
      batch_size: 8        # 并发识别图片数
    api:                   # 发送给 /chat/completions 的参数；新增任意键都会自动透传
      model: "qwen35-thinking-general"
      temperature: 0.0     # 贪心解码
      top_p: 1.0           # 关闭
      top_k: 0             # 关闭（部分引擎用 0/负数表示禁用）
      min_p: 0.0           # 关闭；若引擎要求非零可用 0.05
      presence_penalty: 0.0  # 必须为 0
      frequency_penalty: 0.0 # 同理为 0
      repeat_penalty: 1.0  # 保持关闭；只有输出复读时才微调到 1.03~1.05
      seed: 42             # 固定种子
      reasoning: "on"      # 保留；让模型先分析证据再打分
      #max_tokens: 1024

paths:
  reports_dir: "D:/AI/Reports/"                        # 报告所在目录
  template: "云安全-课程报告-评分模板.xlsx"        # rule 表来源 & result 表写入目标（同一文件）
  output: ""                                      # 结果输出 xlsx；留空表示直接写回 template 文件
  captions_dir: ""                                # 图片描述 txt 保存目录；留空表示与原报告同目录
  save_parsed: false                              # 是否把解析出的 md/图片落盘（默认仅驻留内存）

prompts:
  # LLM 评分项通用 Prompt，占位符：{key} {evaluation} {score_range}
  llm_item: |
    你是一位非常严格且谨慎的课程任务评审教授。请严格按照给定的评分标准，对下述评分项进行评分。
    请谨慎给出高于90%的评分，只有非常完美的内容，才能给出高于90分的评分。

    评分项编号：{key}
    评分标准：{evaluation}
    分数范围：{score_range}

    报告内容（Markdown，其中图片位置已嵌入由多模态模型生成的图片描述）：
    ---
    {report}
    ---

    要求：
    1. 评语用中文，简要说明给分理由（依据评分标准逐点说明）。
    2. 如果评分标准中规定了超出上限的额外加分情形（如亲身体会、亲身经历），按标准执行。
    3. confidence 表示你对本次评分的置信度，取值 0~1（1 表示非常确定）。
    4. 只输出一个 JSON 对象，不要输出任何其他内容，格式：
       {{"score": <数字>, "confidence": <0~1的数字>, "comment": "<评语>"}}
  # 图片描述嵌入 MD 时的引导语
  image_context: |
    [图片描述 P{n}: {caption}]
  # vllm 多模态识图时发送给模型的提示词（会原样提交到 /chat/completions 的 text 内容）
  image_prompt: |
    你是课程报告的图表描述员。请描述图片。输出必须遵守以下全部规则。
    # 叙述骨架（必须按此顺序展开，顺序不能变）
    1. 一句话说明图的类型（是什么类型的图）；
    2. 图中出现的主要元素及其名称，按从上到下、从左到右的顺序；
    3. 元素之间的连接或数据流向，用"从……到……"的句式逐条说清（若没有则注明“未发现连接或数据流关系”）；
    4. 图中明确标注的数字或结论（若没有则注明“未发现数字或结论”）；
    5. 这张图在报告中的作用（一句话）。
    # 硬性规则
    1. 描述内容按上述要求以数字编号形式列出。
    2. 只描述图中可见的内容，禁止推测图外信息、禁止补全省略的内容。
    3. 元素名称一律原样转录图中文字，不翻译、不改写、不纠正错别字。引用名称时用引号括起，如"数据访问层"。
    4. 连接关系必须引用图中真实存在的两个名称，禁止新造名称。
    5. 数字只写图上明确印出的，严禁按坐标轴位置估算。
    6. 看不清或不确定的内容，直接说"无法辨认"，不要猜测。
    7. 全文只陈述事实，不出现"清晰美观""设计合理"等评价性词语。
